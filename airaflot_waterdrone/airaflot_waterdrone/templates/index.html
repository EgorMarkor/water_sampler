<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Выбор сценария</title>

    <!-- Highlight.js -->
    <link
      rel="stylesheet"
      href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    />
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <!-- Стили -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='styles.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Выбор сценария</h1>

      <button id="restart-system-btn" onclick="restartService()">
            Перезапустить систему
          </button>

          <style>
            #restart-system-btn {
              position: fixed;
              bottom: 20px;
              right: 20px;
              background-color: #d9534f; /* красный */
              color: white;
              border: none;
              border-radius: 8px;
              padding: 12px 20px;
              font-size: 16px;
              font-weight: bold;
              cursor: pointer;
              box-shadow: 0 4px 8px rgba(0,0,0,0.2);
              transition: background 0.2s;
              z-index: 9999;
            }
            #restart-system-btn:hover {
              background-color: #c9302c; /* чуть темнее при наведении */
            }
          </style>

      <!-- Иконка настроек -->
      <button
        class="settings-icon"
        onclick="toggleParameters()"
        title="Показать/скрыть параметры"
      >
        ⚙️
      </button>

      <div class="card">
        <label for="scenario">Выберите сценарий:</label>
        <select
          name="scenario"
          id="scenario"
          onchange="changeScenario(this.value)"
        >
          {% for scenario in scenario_list %}
          <option
            value="{{ scenario.name }}"
            {% if current_scenario and scenario.name == current_scenario.name %}selected{% endif %}
          >
            {{ scenario.display_name }}
          </option>
          {% endfor %}
        </select>
        <div
          id="scenario-warning"
          style="color: red; margin-top: 10px; display: none"
        >
          Перезапустите систему для смены сценария.
        </div>
      </div>

      <div class="card status">
        <h2>
          Активный сценарий:
          <span id="current-scenario" class="">Загрузка…</span>
        </h2>
        <h3>
          Состояние:
          <span id="scenario-state" class="">Загрузка…</span>

          <!-- Кнопки управления сервисом -->
          <button id="run-service-btn" style="margin-left: 20px">
            Запустить сервис
          </button>

          <div
            id="inline-depth-parameter"
            class="inline-parameter"
            style="display: none"
          >
            <label for="depth-select">Глубина по умолчанию:</label>
            <select id="depth-select">
              <option value="30">0.3 м</option>
              <option value="100">1 м</option>
              <option value="200">2 м</option>
              <option value="300">3 м</option>
            </select>
            <button onclick="saveInlineDepthParameter()">Сохранить</button>
          </div>
        </h3>
      </div>

      <div class="card">
        <h2>Узлы и состояния</h2>
        <div class="button-group">
          <button
            onclick="fetch('/activate').then(r=>r.text()).then(t=>alert(t)).catch(e=>alert('Ошибка: '+e))"
          >
            Запустить узлы
          </button>
          <button
            style="display: none"
            onclick="fetch('/deactivate').then(r=>r.text()).then(t=>alert(t)).catch(e=>alert('Ошибка: '+e))"
          >
            Остановить узлы
          </button>
        </div>
        <div id="nodes">Загрузка…</div>
      </div>

      <div class="modal" id="parameters-modal" style="display: none">
        <div class="modal-content">
          <div class="modal-header">
            <h2>Параметры</h2>
            <button class="modal-close-btn" onclick="closeParametersModal()">
              ×
            </button>
          </div>
          <div class="modal-body">
            <div id="parameters">Загрузка…</div>
          </div>
          <div class="modal-footer">
            <div class="button-group">
              <button onclick="saveParameters()">Сохранить</button>
              <button onclick="closeParametersModal()">Закрыть</button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <h2>
          Файлы логов
          <button
            id="toggle-all-logs"
            class="show-all-toggle"
            onclick="toggleAllFolders('log')"
          >
            Показать все папки
          </button>
          <button
            id="refresh-logs"
            class="show-all-toggle"
            onclick="refreshLogFiles()"
          >
            Обновить
          </button>
        </h2>
        <div class="button-group">
          <label for="log-delete-date">Удалить папки по дате:</label>
          <input type="date" id="log-delete-date" />
          <button onclick="deleteLogFoldersByDate()">Удалить</button>
        </div>
        <div id="log-files">Загрузка…</div>

        <div class="file-content-container" id="log-file-content-container">
          <div class="file-content-header">
            <span id="log-file-name">Содержимое файла</span>
            <button
              type="button"
              class="show-all-toggle"
              onclick="refreshLogFileContent()"
            >
              Обновить
            </button>
            <button class="close-btn" onclick="closeFileContent('log')">×</button>
          </div>
          <div class="file-content-body" id="log-file-content-body"></div>
        </div>
      </div>

      <div class="card">
        <h2>
          Файлы измерений
          <button
            id="toggle-all-meas"
            class="show-all-toggle"
            onclick="toggleAllFolders('meas')"
          >
            Показать все папки
          </button>
          <button
            id="refresh-meas"
            class="show-all-toggle"
            onclick="refreshMeasFiles()"
          >
            Обновить
          </button>
          <button
            id="download-meas"
            class="show-all-toggle"
            onclick="downloadMeasArchive()"
          >
            Скачать архив измерений
          </button>
        </h2>
        <div class="button-group">
          <label for="meas-delete-date">Удалить папки по дате:</label>
          <input type="date" id="meas-delete-date" max />
          <button onclick="deleteMeasFoldersByDate()">Удалить</button>
        </div>
        <div id="meas-files">Загрузка…</div>

        <div class="file-content-container" id="meas-file-content-container">
          <div class="file-content-header">
            <span id="meas-file-name">Содержимое файла</span>
            <button
              type="button"
              class="show-all-toggle"
              onclick="refreshMeasFileContent()"
            >
              Обновить
            </button>
            <button class="close-btn" onclick="closeFileContent('meas')">
              ×
            </button>
          </div>
          <div class="file-content-body" id="meas-file-content-body"></div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
      // Локализованные подписи, если нужно переиспользовать
      const UI_TEXT = {
        loading: "Загрузка…",
        restartOk: "Сервис перезапущен.",
        restartFail: "Не удалось перезапустить сервис",
      };

      // Перезапуск сервиса (POST /restart)
      async function restartService() {
        try {
          const res = await fetch("/restart_service", { method: "POST" });
          const text = await res.text();
          if (!res.ok) throw new Error(text || "HTTP " + res.status);
          alert(text || UI_TEXT.restartOk);
        } catch (err) {
          alert(UI_TEXT.restartFail + ": " + err.message);
        }
      }
    </script>
  </body>
</html>
